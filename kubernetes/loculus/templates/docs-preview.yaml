{{- $dockerTag := include "loculus.dockerTag" .Values }}
{{- $gatewayName := default "traefik" $.Values.networking.gatewayName -}}
{{- $gatewayNamespace := default "ingress-traefik" $.Values.networking.gatewayNamespace -}}
{{- $docsHost := printf "docs%s%s" $.Values.networking.subdomainSeparator $.Values.networking.host }}
{{- if .Values.previewDocs }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loculus-docs
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loculus
      component: docs
  template:
    metadata:
      annotations:
        valuesHash: {{ .Values | toJson | sha256sum | quote }}
      labels:
        app: loculus
        component: docs
    spec:
      {{- include "loculus.podScheduling" . | nindent 6 }}
      {{- include "loculus.podSecurityContext" (list "docs" .Values) | nindent 6 }}
      containers:
        - name: docs
          image: {{ include "loculus.image" (dict "name" "docs" "defaultRepository" "ghcr.io/loculus-project/docs" "values" $.Values) }}
          imagePullPolicy: {{ include "loculus.imagePullPolicy" (dict "name" "docs" "values" $.Values) }}
          {{- include "loculus.resources" (list "docs" .Values) | nindent 10 }}
          {{- include "loculus.containerSecurityContext" (list "docs" .Values) | nindent 10 }}
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: loculus-docs
spec:
  selector:
    app: loculus
    component: docs
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loculus-docs-ingress
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
      sectionName: websecure
  hostnames:
    - "{{ $docsHost }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: loculus-docs
          port: 80
          weight: 1
---
{{- end }}