{{- include "loculus.assertPublicHostsRoutable" . -}}
{{- $traefikApiVersion := ternary "traefik.io/v1alpha1" "traefik.containo.us/v1alpha1" (eq (int $.Values.networking.traefikVersion) 3) -}}
{{- $gatewayName := default "traefik" $.Values.networking.gatewayName -}}
{{- $gatewayNamespace := default "ingress-traefik" $.Values.networking.gatewayNamespace -}}
apiVersion: {{ $traefikApiVersion }}
kind: Middleware
metadata:
  name: compression-middleware
spec:
  compress: {}
---
apiVersion: {{ $traefikApiVersion }}
kind: Middleware
metadata:
  name: redirect-middleware
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{ if $.Values.secrets.basicauth }}
---
apiVersion: {{ $traefikApiVersion }}
kind: Middleware
metadata:
  name: basic-auth
spec:
  basicAuth:
    secret: basicauth
{{ end  }}
{{ if $.Values.robotsNoindexHeader }}
---
apiVersion: {{ $traefikApiVersion }}
kind: Middleware
metadata:
  name: noindex-robots-header
spec:
  headers:
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
{{ end }}
---
apiVersion: {{ $traefikApiVersion }}
kind: Middleware
metadata:
  name: redirect-www-middleware
spec:
  redirectRegex:
    regex: "^https://www\\.(.*)"
    replacement: "https://$1"
    permanent: true
---
{{- if eq $.Values.environment "server" }}
{{- $ingressHosts := $.Values.networking.ingressHosts | default dict }}
{{- $websiteHost := $ingressHosts.website | default (include "loculus.ingressHost" (include "loculus.websiteUrl" .)) }}
{{- /* only serve the www. alias for the plain default host: a cert for www.<override> would likely have no DNS */}}
{{- $wwwHost := ternary (printf "www.%s" $websiteHost) "" (and (eq $websiteHost $.Values.networking.host) (not (hasPrefix "www." $websiteHost))) }}
{{- $backendHost := $ingressHosts.backend | default (include "loculus.ingressHost" (include "loculus.backendUrl" .)) }}
{{- $keycloakHost := $ingressHosts.keycloak | default (include "loculus.ingressHost" (include "loculus.keycloakUrl" .)) }}
{{- $minioHost := include "loculus.ingressHost" (include "loculus.s3Url" .) }}
{{- $middlewareList := list "compression-middleware" }}
{{- if $.Values.networking.enforceHTTPS }}
{{- $middlewareList = append $middlewareList "redirect-middleware" }}
{{- end }}
{{ if $.Values.robotsNoindexHeader }}
{{ $middlewareList = append $middlewareList "noindex-robots-header" }}
{{ end }}

{{ $middlewareListForWebsite := $middlewareList }}
{{ $middlewareListForKeycloak := $middlewareList }}

{{ if $.Values.secrets.basicauth }}
{{ $middlewareListForWebsite = append $middlewareListForWebsite "basic-auth" }}
{{ $middlewareListForKeycloak = append $middlewareListForKeycloak "basic-auth" }}
{{ end }}

{{ if $wwwHost }}
{{ $middlewareListForWebsite = append $middlewareListForWebsite "redirect-www-middleware" }}
{{ end }}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loculus-website-ingress
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
      sectionName: websecure
  hostnames:
    - "{{ $websiteHost }}"
    {{- if $wwwHost }}
    - "{{ $wwwHost }}"
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        {{- range $middlewareName := $middlewareListForWebsite }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ $middlewareName }}
        {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: loculus-website-service
          port: 3000
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loculus-backend-ingress
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
      sectionName: websecure
  hostnames:
    - "{{ $backendHost }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        {{- range $middlewareName := $middlewareList }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ $middlewareName }}
        {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: loculus-backend-service
          port: 8079
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loculus-keycloak-ingress
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
      sectionName: websecure
  hostnames:
    - "{{ $keycloakHost }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        {{- range $middlewareName := $middlewareListForKeycloak }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ $middlewareName }}
        {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: loculus-keycloak-service
          port: 8083
          weight: 1
---
{{- if and .Values.s3.enabled .Values.runDevelopmentS3 }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-ingress
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
      sectionName: websecure
  hostnames:
    - "{{ $minioHost }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        {{- range $middlewareName := $middlewareList }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ $middlewareName }}
        {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: loculus-minio-service
          port: 8084
          weight: 1
{{- end }}
{{- end }}
